# Operational guide:
# When you add a new script in package.json (e.g. "build", "lint", "test", "coverage", etc.),
# add a corresponding step here to run that command in CI/CD.
# Example: if you add "coverage", add a step:
#   - name: Run coverage
#     run: pnpm coverage
#
# Reminder: every script that must be validated in CI/CD should have a dedicated step.

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the commit range
      # Run the gitleaks BINARY directly, not gitleaks-action@v2: the Action
      # requires a GITLEAKS_LICENSE for org-owned repos (foomakers is an org),
      # which would fail the job before scanning. The MIT-licensed binary has no
      # such gate. Fail-closed: any leak -> non-zero exit -> red build (R6.5).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -   # supply-chain integrity: fail-closed if the asset was swapped
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  build:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.event.head_commit.message, 'chore: release v'))"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - name: Ensure pnpm is available (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found in PATH; attempting to enable via corepack"
            corepack enable || true
            corepack prepare pnpm@10.15.0 --activate || true
          fi
      - name: Install dependencies
        run: pnpm install
      - name: Load environment variables from GitHub Secrets
        run: |
          echo "PAIR_ADOPTION_FOLDER=$PAIR_ADOPTION_FOLDER" >> $GITHUB_ENV
        env:
          PAIR_ADOPTION_FOLDER: ${{ vars.PAIR_ADOPTION_FOLDER }}
      - name: Load environment variables from root .env (if present)
        run: |
          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
          fi
      - name: Run type check
        run: pnpm ts:check
      - name: Run build
        run: pnpm build
      - name: Run lint
        run: pnpm lint
      - name: Run code-hygiene check
        run: pnpm hygiene:check
      - name: Run docs-staleness check
        run: pnpm docs:staleness
      - name: Run skills-conformance check
        run: pnpm skills:conformance
      - name: Run duplication check
        run: pnpm dup:check
      - name: Install Playwright browsers
        run: |
          pnpm --filter @pair/brand exec playwright install --with-deps chromium
          pnpm --filter @pair/website exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm test
      - name: Run coverage thresholds (brand, website)
        run: pnpm turbo test:coverage --filter=@pair/brand --filter=@pair/website
      - name: Run E2E tests
        run: pnpm --filter @pair/website e2e
