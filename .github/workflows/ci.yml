# Operational guide:
# When you add a new script in package.json (e.g. "build", "lint", "test", "coverage", etc.),
# add a corresponding step here to run that command in CI/CD.
# Example: if you add "coverage", add a step:
#   - name: Run coverage
#     run: pnpm coverage
#
# Reminder: every script that must be validated in CI/CD should have a dedicated step.

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the commit range
      # Run the gitleaks BINARY directly, not gitleaks-action@v2: the Action
      # requires a GITLEAKS_LICENSE for org-owned repos (foomakers is an org),
      # which would fail the job before scanning. The MIT-licensed binary has no
      # such gate. Fail-closed: any leak -> non-zero exit -> red build (R6.5).
      - name: Secret scan (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -   # supply-chain integrity: fail-closed if the asset was swapped
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --exit-code 1

  build:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.event.head_commit.message, 'chore: release v'))"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - name: Ensure pnpm is available (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found in PATH; attempting to enable via corepack"
            corepack enable || true
            corepack prepare pnpm@10.15.0 --activate || true
          fi
      - name: Install dependencies
        run: pnpm install
      - name: Load environment variables from GitHub Secrets
        run: |
          echo "PAIR_ADOPTION_FOLDER=$PAIR_ADOPTION_FOLDER" >> $GITHUB_ENV
        env:
          PAIR_ADOPTION_FOLDER: ${{ vars.PAIR_ADOPTION_FOLDER }}
      - name: Load environment variables from root .env (if present)
        run: |
          if [ -f .env ]; then
            export $(grep -v '^#' .env | xargs)
          fi
      - name: Run type check
        run: pnpm ts:check
      - name: Run build
        run: pnpm build
      - name: Run lint
        run: pnpm lint
      - name: Run code-hygiene check
        run: pnpm hygiene:check
      # Its own step, NOT left to the unit test inside `pnpm test`: `test` is a
      # cacheable turbo task whose inputs all live inside @pair/dev-tools, so a
      # scenario added mode 644 without touching that package replays a cached
      # PASS and the guard never runs. This step and the root `quality-gate`
      # chain are the enforcement points (#400).
      - name: Run smoke-scenario mode check
        run: pnpm smoke-modes:check
      - name: Run docs-staleness check
        run: pnpm docs:staleness
      - name: Run skills-conformance check
        run: pnpm skills:conformance
      - name: Run duplication check
        run: pnpm dup:check
      - name: Install Playwright browsers
        run: |
          pnpm --filter @pair/brand exec playwright install --with-deps chromium
          pnpm --filter @pair/website exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm test
      - name: Run coverage thresholds (brand, website)
        run: pnpm turbo test:coverage --filter=@pair/brand --filter=@pair/website
      # Dogfood of the story #282 coverage guardrail on pair's own CI (opt-in:
      # way-of-working `Coverage guardrail: enabled`). Standalone/minimal — NOT
      # the full tier-aware pipeline (#258). Reuses the coverage run above: reads
      # the line % from each package's istanbul coverage-summary.json and blocks
      # a regression below the human-committed baseline in tech/coverage-baseline.md.
      # Conservative fixed tier=red => a missing coverage report fails safe.
      - name: Coverage guardrail (regression gate — dogfood #282)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source .pair/knowledge/assets/coverage-gate.sh
          TIER=red
          CFG=.pair/adoption/tech/coverage-baseline.md
          pct() {
            node -e "const fs=require('fs');process.stdout.write(String(JSON.parse(fs.readFileSync('$1','utf8')).total.lines.pct))"
          }
          BRAND_PCT="$(pct packages/brand/coverage/coverage-summary.json || true)"
          WEBSITE_PCT="$(pct apps/website/coverage/coverage-summary.json || true)"
          echo "coverage: brand(shared)=${BRAND_PCT}%  website(frontend)=${WEBSITE_PCT}%"
          # Hand the measured numbers to the commit-back step (#372) so the
          # extraction is not duplicated. Values only — no decision is made here.
          # VALIDATED before writing: $GITHUB_ENV is the classic Actions
          # environment-injection sink, and a value carrying a newline would
          # define arbitrary further variables for every later step. These come
          # from a coverage report, so a stray value is a tooling bug rather than
          # an attack — but the guard costs one case statement and removes the
          # sink entirely. A non-numeric value is dropped with a warning: the
          # ratchet then sees no measurement and proposes nothing, which is the
          # conservative outcome (it never blocks the gate — AC6).
          for kv in "PAIR_COV_SHARED=${BRAND_PCT}" "PAIR_COV_FRONTEND=${WEBSITE_PCT}"; do
            case "${kv#*=}" in
              '' | *[!0-9.]*)
                echo "::warning::${kv%%=*}: non-numeric coverage value, not exported to the ratchet"
                ;;
              *) echo "$kv" >>"$GITHUB_ENV" ;;
            esac
          done
          coverage_gate "$TIER" shared   "$BRAND_PCT"   "$CFG"
          coverage_gate "$TIER" frontend "$WEBSITE_PCT" "$CFG"
      # Coverage baseline commit-back (story #372) — OPT-IN and nested under the
      # guardrail above: `Coverage baseline commit-back` in way-of-working.md is
      # `disabled` here (and is the framework default), so today this step is a
      # no-op that prints WHY it skipped and writes nothing (AC1).
      # Thin entrypoint (ADL 2026-07-13): every decision — the skip predicate
      # (flag / base-branch push only / ratchet-marker loop guard), the monotonic
      # ratchet, the git+gh command plan and the refusal classification — lives in
      # the unit-tested module packages/knowledge-hub/src/tools/coverage-baseline-ratchet.ts;
      # the CLI wiring is demonstrated by the coverage-gate smoke scenario.
      # Placed AFTER the guardrail and always exiting 0: a refused write degrades
      # to a ::warning:: and can never change the gate's verdict (AC6).
      - name: Coverage baseline commit-back (ratchet — opt-in #372)
        env:
          # Attacker-controlled text: read via env, never interpolated into the script.
          PAIR_RATCHET_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PAIR_RATCHET_BASE_BRANCH: main
          # Dedicated, repo-scoped credential (contents:write + pull-requests:write,
          # no protection bypass). Absent => the step warns, the gate is unaffected.
          # Least privilege in the EVENT dimension too: bound to the only event
          # allowed to write, so a pull-request run — where the diff under test can
          # influence what this job executes — never has the token in its
          # environment. Belt to the module's own `not-base-push` skip (braces).
          COVERAGE_RATCHET_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == 'main') && secrets.COVERAGE_RATCHET_TOKEN || '' }}
        run: |
          set -euo pipefail
          pnpm --filter @pair/knowledge-hub coverage:ratchet \
            --config .pair/adoption/tech/coverage-baseline.md \
            --way-of-working .pair/adoption/tech/way-of-working.md \
            --measured "shared=${PAIR_COV_SHARED:-}" \
            --measured "frontend=${PAIR_COV_FRONTEND:-}"
      - name: Run E2E tests
        run: pnpm --filter @pair/website e2e

  # Smoke suite (story #400). Until now `run-all.sh --ci` was invoked by NO
  # workflow: every real-CLI guarantee it encodes — including `assert_pinned_bug`,
  # which is meant to flip loudly when a pinned bug is fixed upstream — fired only
  # when a human remembered to run `pnpm smoke-tests`. `CI_TESTS` was a claim the
  # repo did not honour, and that silence is how `scenarios/coverage-gate.sh` stayed
  # unexecutable (mode 644) for weeks.
  #
  # PARALLEL to `build`, as its own status check: a red here says "a real-CLI
  # scenario broke", which is a different diagnosis from a red unit/lint gate.
  #
  # MEASURED COST (AC6) — observed IN CI, on this job, not extrapolated from a
  # local run: 1m53s end-to-end for the 18-scenario CI-safe list. Run 31538360697,
  # job 93934813269 (2026-08-11, ubuntu-latest): checkout+pnpm 4s, install 10s,
  # CLI+deps build 6s, the suite itself 1m28s, all 18 scenarios PASS.
  # In the SAME run `build` took 3m59s, so smoke is ~47% of the critical path job:
  # it adds runner time and ZERO wall-clock.
  # REVISIT THRESHOLD: revisit when smoke exceeds ~75% of `build` in the same run
  # — ~3m00s against today's 3m59s, i.e. roughly +1m05s of new scenarios from here.
  # Past it, the list gets scoped (reasons recorded in lib/ci-tests.sh) or moved to
  # a schedule — deliberately, not tolerated silently. A nightly was rejected on
  # data: it would report a pinned-bug flip up to 24h late, on main, instead of on
  # the PR that caused it.
  # Context for the number: 67s was measured at refinement for 16 scenarios, before
  # this story added registry-exclude.sh and no-dataset-in-artifacts.sh, removed the
  # network-dependent default-resolution.sh, and made coverage-gate.sh — the single
  # most expensive scenario — actually RUN for the first time.
  #
  # CHECK-ONLY (AC8, ADL 2026-07-31): this job never repairs anything — no `chmod`,
  # no commit. A NOT EXECUTABLE scenario is reported with its mode and the fix; the
  # human commits it. The committed mode itself is guarded by a unit test in
  # @pair/dev-tools (smoke-scenario-modes), which runs in `build`.
  #
  # No secrets are used, so a fork PR is a full-strength run.
  smoke:
    runs-on: ubuntu-latest
    if: "!(startsWith(github.event.head_commit.message, 'chore: release v'))"
    # This job executes PR-authored code (pnpm lifecycle scripts + shell scenarios
    # that package and run a CLI), so it takes the least token it can and a timeout
    # that turns a scenario blocking on stdin into a 15-minute red instead of a
    # 6-hour default. Defence in depth: a fork PR already gets a read-only token
    # and no secrets.
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'
      - name: Ensure pnpm is available (fallback)
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            echo "pnpm not found in PATH; attempting to enable via corepack"
            corepack enable || true
            corepack prepare pnpm@10.15.0 --activate || true
          fi
      - name: Install dependencies
        run: pnpm install
      # `...` = the package AND its workspace dependencies. Dependency-aware
      # deliberately: a filtered `pnpm build` bypasses turbo's dependsOn graph and
      # the CLI compile dies with ~45 `TS2307: Cannot find module
      # '@pair/content-ops'`. See DEVELOPMENT.md § "Turbo Caching" — this job is
      # the live example named there.
      - name: Build CLI + its workspace deps
        run: pnpm turbo build --filter=@pair/pair-cli...
      # The runner then packages the built CLI itself and works in $RUNNER_TEMP.
      # `--ci` selects the CI-safe list (lib/ci-tests.sh), enables PAIR_DIAG=1 and
      # appends the report to the job summary.
      - name: Run smoke suite (CI-safe list)
        run: ./scripts/smoke-tests/run-all.sh --ci --cleanup
