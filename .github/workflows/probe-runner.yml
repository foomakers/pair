# TEMPORARY probe (#413, review round 16) — reverted in the next commit.
# Question: which `runs-on` VALUES does GitHub resolve to a GitHub-hosted Ubuntu
# runner, and what happens to a job pinned to `self-hosted` on this repo?
name: Probe Runner

on:
  pull_request:
    branches:
      - main

jobs:
  d7-ubuntu-2404:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "D7-2404-RAN $(uname -m) $(. /etc/os-release && echo $VERSION_ID)"
  d7-ubuntu-2204:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "D7-2204-RAN $(uname -m) $(. /etc/os-release && echo $VERSION_ID)"
  d7-list-ubuntu:
    runs-on: [ubuntu-latest]
    steps:
      - run: echo "D7-LIST-RAN $(uname -m) $(. /etc/os-release && echo $VERSION_ID) RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
  d7-quoted-ubuntu:
    runs-on: 'ubuntu-latest'
    steps:
      - run: echo "D7-QUOTED-RAN $(uname -m) RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
  d7-self-hosted:
    runs-on: self-hosted
    steps:
      - run: echo "D7-SELFHOSTED-RAN"
  d7-self-hosted-list:
    runs-on: [self-hosted, linux]
    steps:
      - run: echo "D7-SELFHOSTED-LIST-RAN"
