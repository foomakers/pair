name: Test audit (manual, G8 and redundancy)
on:
  workflow_dispatch:
    inputs:
      redundancy_modules:
        description: 'Optional: comma-separated vitest modules for the redundancy report (e.g. packages/content-ops,apps/pair-cli); empty skips it'
        required: false
        default: ''
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      # Report-only: regenerate test-audit/ and compare with the committed report (G8).
      - run: git show HEAD:test-audit/report.json > "$RUNNER_TEMP/prev-report.json"
      - run: pnpm --filter @pair/dev-tools test-audit
      - run: pnpm --filter @pair/dev-tools test-audit:gates --g8-from "$RUNNER_TEMP/prev-report.json"
      # Manual only: one redundancy report (vitest mutation + Playwright fingerprint) for a cleanup card.
      # Never scheduled, never on PRs.
      - name: Redundancy report
        if: inputs.redundancy_modules != ''
        run: >
          pnpm --filter @pair/dev-tools test-audit:redundancy
          --modules "${{ inputs.redundancy_modules }}"
          --out test-audit/redundancy/report.json
      - uses: actions/upload-artifact@v4
        if: inputs.redundancy_modules != ''
        with:
          name: test-audit-redundancy
          path: test-audit/redundancy/report.json
