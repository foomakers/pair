name: Version (release dispatch)

# Dispatch-only: nothing releases on merge. Run `pnpm release <channel>` (or dispatch here).
# Two runs per release: this one versions + tags, then dispatches release.yml (publish).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [pre, rc, final]
      version:
        description: 'Optional base version override (X.Y.Z, > last final, untagged)'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version, tag, dispatch publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pnpm install --frozen-lockfile

      # Same state module as `pnpm release` — CI is authoritative (stale local tags can't pass).
      - name: Validate and plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          ARGS=("$CHANNEL" --no-fetch --json)
          [ -n "$OVERRIDE" ] && ARGS+=(--version "$OVERRIDE")
          PLAN="$RUNNER_TEMP/plan.json"  # outside the repo: never committed
          pnpm --silent release "${ARGS[@]}" | tee "$PLAN"
          node -e "
            const p=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8').split('\n').filter(l=>l.startsWith('{')).pop());
            if(!p.ok){console.error(p.error);process.exit(1)}
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+p.version+'\ntag='+p.tag+'\n')" "$PLAN"

      - name: Version packages
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD=$(node -p "require('./apps/pair-cli/package.json').version")
          pnpm changeset version
          NEW=$(node -p "require('./apps/pair-cli/package.json').version")  # changesets' computed version
          # one version for the whole fixed group (+ root), incl. the -pre.N/-rc.N suffix
          node -e "
            const fs=require('fs');
            const group=JSON.parse(fs.readFileSync('.changeset/config.json','utf8')).fixed[0];
            const files=['package.json',...require('child_process').execSync('git ls-files \"**/package.json\" package.json',{encoding:'utf8'}).split('\n').filter(Boolean)];
            for(const f of files){const p=JSON.parse(fs.readFileSync(f,'utf8'));
              if(f==='package.json'||group.includes(p.name)){p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')}}
            const bad=group.filter(n=>{const f=files.find(x=>x!=='package.json'&&JSON.parse(fs.readFileSync(x,'utf8')).name===n);return f&&JSON.parse(fs.readFileSync(f,'utf8')).version!==process.env.VERSION});
            if(bad.length){console.error('fixed group out of sync: '+bad);process.exit(1)}"
          pnpm changelog-version -- "$NEW" "$VERSION"   # CHANGELOG headings + dep lines follow the override
          pnpm sync-version -- "$OLD"

      - name: Commit and tag
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          HUSKY=0 git commit -m "chore: release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          if [ "$CHANNEL" = final ]; then
            HUSKY=0 git push origin main "$TAG"   # version commit + changelog land on main
          else
            HUSKY=0 git push origin "$TAG"        # ephemeral commit: tag only, main stays clean
          fi

      - name: Dispatch publish (second run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh workflow run release.yml --ref main -f version="$TAG"
