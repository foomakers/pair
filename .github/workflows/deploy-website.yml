name: Deploy Website (production)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse non-main ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production website deploy only runs from main (got ${{ github.ref }})"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vercel CLI rejects deploys when the commit author email is not in the
      # Vercel account's verified emails. Amend locally (never pushed).
      - name: Set git author for Vercel
        run: |
          git config user.email "foomakers42@gmail.com"
          git config user.name "foomakers"
          git commit --amend --no-edit --reset-author --no-verify

      - name: Deploy to Vercel (production)
        run: |
          ./scripts/workflows/release/deploy-website.sh --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
