name: Deploy Website (production)

on:
  workflow_dispatch:

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Refuse non-main ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production website deploy only runs from main (got ${{ github.ref }})"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vercel CLI rejects deploys when the commit author email is not in the
      # Vercel account's verified emails. Amend locally (never pushed).
      - name: Set git author for Vercel
        run: |
          git config user.email "foomakers42@gmail.com"
          git config user.name "foomakers"
          git commit --amend --no-edit --reset-author --no-verify

      - name: Create GitHub deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_ID=$(gh api -X POST repos/${{ github.repository }}/deployments \
            --input - <<'JSON' | jq -r '.id'
          {
            "ref": "${{ github.sha }}",
            "environment": "Website Production",
            "auto_merge": false,
            "required_contexts": []
          }
          JSON
          )
          echo "id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          gh api repos/${{ github.repository }}/deployments/${DEPLOY_ID}/statuses \
            -f state=in_progress

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          set +e
          OUTPUT=$(./scripts/workflows/release/deploy-website.sh --prod 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          [ $EXIT_CODE -eq 0 ] || exit $EXIT_CODE
          echo "url=$(echo "$OUTPUT" | grep '^URL:' | sed 's/^URL: //')" >> $GITHUB_OUTPUT
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deployment status success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=success \
            -f environment_url="${{ steps.deploy.outputs.url }}"

      - name: Deployment status failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=failure
