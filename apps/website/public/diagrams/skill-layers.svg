<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" width="1080" height="350" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Skill layers</title>
<desc id="d">Three layers of skills. Capability skills sit at the bottom, process skills in the middle, and workflow, brainstorm, loop and batch skills on top. Each upper layer drives the layer below it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1080" height="350" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Skill layers</text>
<rect x="30" y="50" width="1020" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="540.0" y="81.0" text-anchor="middle" fill="#222" font-weight="bold">Top: workflow, brainstorm, loop, batch</text>
<text x="540.0" y="97.0" text-anchor="middle" fill="#222">/pair-workflow-cycle, /pair-process-brainstorm, /pair-loop, /pair-implement-batch, /pair-refine-batch, /pair-next</text>
<rect x="30" y="150" width="1020" height="70" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="540.0" y="181.0" text-anchor="middle" fill="#222" font-weight="bold">Middle: process skills</text>
<text x="540.0" y="197.0" text-anchor="middle" fill="#222">specify-prd, bootstrap, plan-*, refine-story, implement, review</text>
<rect x="30" y="250" width="1020" height="70" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="540.0" y="281.0" text-anchor="middle" fill="#222" font-weight="bold">Bottom: capability skills</text>
<text x="540.0" y="297.0" text-anchor="middle" fill="#222">verify-quality, record-decision, write-issue, grill, classify, estimate, assess-*</text>
<polyline points="540,150 540,120" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="540,250 540,220" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
