<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Release channels: pre, rc, final and cleanup</title>
<desc id="d">A release moves from a pre-release channel (pre) to a release candidate (rc) and then to the final release. Pre and rc tags are published for validation and pruned from the registry and the repository tags once the final release ships.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1000" height="300" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Release channels: pre, rc, final and cleanup</text>
<rect x="30" y="90" width="200" height="70" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="130.0" y="113.0" text-anchor="middle" fill="#222" font-weight="bold">pre</text>
<text x="130.0" y="129.0" text-anchor="middle" fill="#222">0.x.y-pre.N</text>
<text x="130.0" y="145.0" text-anchor="middle" fill="#222">validation builds</text>
<rect x="310" y="90" width="200" height="70" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="410.0" y="113.0" text-anchor="middle" fill="#222" font-weight="bold">rc</text>
<text x="410.0" y="129.0" text-anchor="middle" fill="#222">0.x.y-rc.N</text>
<text x="410.0" y="145.0" text-anchor="middle" fill="#222">release candidate</text>
<rect x="590" y="90" width="200" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="690.0" y="113.0" text-anchor="middle" fill="#222" font-weight="bold">final</text>
<text x="690.0" y="129.0" text-anchor="middle" fill="#222">0.x.y</text>
<text x="690.0" y="145.0" text-anchor="middle" fill="#222">latest on npm</text>
<polyline points="230,125 310,125" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="270" y="115" text-anchor="middle" font-size="11" fill="#333">promote</text>
<polyline points="510,125 590,125" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="550" y="115" text-anchor="middle" font-size="11" fill="#333">promote</text>
<rect x="590" y="210" width="380" height="60" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.3"/>
<text x="780.0" y="236.0" text-anchor="middle" fill="#222" font-weight="bold">Cleanup</text>
<text x="780.0" y="252.0" text-anchor="middle" fill="#222">pre/rc dist-tags and git tags pruned after final</text>
<polyline points="690,160 690,210" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="130,160 130,240 590,240" fill="none" stroke="#444" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="140" y="255" text-anchor="start" font-size="11" fill="#333">abandoned pre/rc are pruned too</text>
</svg>
