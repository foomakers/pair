<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">What /pair-assistant configures: area, owner, validator</title>
<desc id="d">Each configuration area maps to the file it lives in, the owner that writes it and the validator it runs before writing. Autonomy, cycle hooks and blocking severities live in tech/automation.md and are written through record-decision after autonomy-policy, cycle-hooks or blocking-severities validation. Workflow profiles and skipRegistries live in pair.config.json. PM tool and State Mapping go to setup-pm, harness to setup-harness, gates to setup-gates and a full pass to bootstrap.</desc>
