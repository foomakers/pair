<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Installing pair into a repository that already has files</title>
<desc id="d">pair-cli install refuses when any registry target already exists. For your own AGENTS.md or CLAUDE.md you choose: keep it, which installs with skip-registries agents and persists the choice in pair.config.json, or overwrite it, which moves yours to a .bak file first. Other existing targets are skipped the same way. Then install only, or install plus bootstrap.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1000" height="380" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Installing pair into a repository that already has files</text>
<rect x="30" y="150" width="200" height="60" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="130.0" y="176.0" text-anchor="middle" fill="#222" font-weight="bold">pair-cli install</text>
<text x="130.0" y="192.0" text-anchor="middle" fill="#222">on an existing repo</text>
<rect x="300" y="150" width="220" height="60" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="410.0" y="176.0" text-anchor="middle" fill="#222" font-weight="bold">Any target exists?</text>
<text x="410.0" y="192.0" text-anchor="middle" fill="#222">AGENTS.md, CLAUDE.md, .claude/skills ...</text>
<polyline points="230,180 300,180" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="300" y="40" width="220" height="56" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="410.0" y="64.0" text-anchor="middle" fill="#222" font-weight="bold">No</text>
<text x="410.0" y="80.0" text-anchor="middle" fill="#222">installs normally</text>
<polyline points="410,150 410,96" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="600" y="150" width="200" height="60" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.3"/>
<text x="700.0" y="176.0" text-anchor="middle" fill="#222" font-weight="bold">Yes: refuses</text>
<text x="700.0" y="192.0" text-anchor="middle" fill="#222">exit 1, nothing written</text>
<polyline points="520,180 600,180" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="600" y="40" width="360" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="780.0" y="63.0" text-anchor="middle" fill="#222" font-weight="bold">Keep your file</text>
<text x="780.0" y="79.0" text-anchor="middle" fill="#222">install --skip-registries agents</text>
<text x="780.0" y="95.0" text-anchor="middle" fill="#222">persisted in pair.config.json; later updates honour it</text>
<rect x="600" y="260" width="360" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="780.0" y="283.0" text-anchor="middle" fill="#222" font-weight="bold">Overwrite your file</text>
<text x="780.0" y="299.0" text-anchor="middle" fill="#222">mv AGENTS.md AGENTS.md.bak (and CLAUDE.md)</text>
<text x="780.0" y="315.0" text-anchor="middle" fill="#222">then pair-cli install as usual</text>
<polyline points="700,150 700,110" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="700,210 700,260" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="290" width="500" height="60" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="280.0" y="316.0" text-anchor="middle" fill="#222" font-weight="bold">Then choose</text>
<text x="280.0" y="332.0" text-anchor="middle" fill="#222">1: install only   |   2: install + bootstrap this project</text>
<polyline points="600,295 530,310" fill="none" stroke="#444" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
</svg>
