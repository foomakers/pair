<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 380" width="1060" height="380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Skill families and how they compose</title>
<desc id="d">Process skills compose capability skills. The workflow coordinator pair-workflow-cycle composes the stage skills, which compose process and capability skills. pair-loop composes the batch workflows, which dispatch the five subagents. The pair-assistant plugin skill delegates to the project skills installed by the CLI.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1060" height="380" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Skill families and how they compose</text>
<rect x="30" y="60" width="300" height="70" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="180.0" y="91.0" text-anchor="middle" fill="#222" font-weight="bold">Process skills</text>
<text x="180.0" y="107.0" text-anchor="middle" fill="#222">/pair-process-implement, review, plan-*</text>
<rect x="30" y="170" width="300" height="70" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="180.0" y="201.0" text-anchor="middle" fill="#222" font-weight="bold">Capability skills</text>
<text x="180.0" y="217.0" text-anchor="middle" fill="#222">/pair-capability-verify-quality, ...</text>
<polyline points="180,130 180,170" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="215" y="155" text-anchor="middle" font-size="11" fill="#333">compose</text>
<rect x="380" y="60" width="300" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="530.0" y="91.0" text-anchor="middle" fill="#222" font-weight="bold">Workflow skills</text>
<text x="530.0" y="107.0" text-anchor="middle" fill="#222">/pair-workflow-cycle + 6 stage skills</text>
<polyline points="380,95 330,95" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="355" y="80" text-anchor="middle" font-size="11" fill="#333">stages compose</text>
<rect x="380" y="170" width="300" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="530.0" y="201.0" text-anchor="middle" fill="#222" font-weight="bold">Loop and batch</text>
<text x="530.0" y="217.0" text-anchor="middle" fill="#222">/pair-loop, pair-implement-batch, pair-refine-batch</text>
<polyline points="530,170 530,130" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="570" y="155" text-anchor="middle" font-size="11" fill="#333">composes</text>
<rect x="380" y="280" width="300" height="60" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.3"/>
<text x="530.0" y="306.0" text-anchor="middle" fill="#222" font-weight="bold">Subagents</text>
<text x="530.0" y="322.0" text-anchor="middle" fill="#222">5 in .claude/agents/</text>
<polyline points="530,240 530,280" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="730" y="60" width="300" height="70" rx="6" fill="#f3ecfb" stroke="#6b46a0" stroke-width="1.3"/>
<text x="880.0" y="91.0" text-anchor="middle" fill="#222" font-weight="bold">Plugin skill</text>
<text x="880.0" y="107.0" text-anchor="middle" fill="#222">/pair-assistant (marketplace only)</text>
<polyline points="730,95 330,95" fill="none" stroke="#444" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="730" y="160" text-anchor="start" font-size="11" fill="#333">delegates to project skills</text>
<rect x="730" y="230" width="300" height="110" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.3"/>
<text x="880.0" y="273.0" text-anchor="middle" fill="#222">Shipped by</text>
<text x="880.0" y="289.0" text-anchor="middle" fill="#222">CLI: all families above</text>
<text x="880.0" y="305.0" text-anchor="middle" fill="#222">Plugin: /pair-assistant only</text>
</svg>
