<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Three drivers, one set of autonomy gates</title>
<desc id="d">One delivery cycle can be driven by the console (pair-cli run), by the in-session coordinator (pair-workflow-cycle) or by the loop (pair-loop). All three read the same autonomy gates: until, prepare and merge. A card stops at the first gate that is not open, and an escalation parks that card for a human while the rest continue.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1000" height="330" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Three drivers, one set of autonomy gates</text>
<rect x="30" y="60" width="250" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="155.0" y="84.0" text-anchor="middle" fill="#222" font-weight="bold">pair-cli run --card</text>
<text x="155.0" y="100.0" text-anchor="middle" fill="#222">console, one card</text>
<rect x="30" y="130" width="250" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="155.0" y="154.0" text-anchor="middle" fill="#222" font-weight="bold">/pair-workflow-cycle</text>
<text x="155.0" y="170.0" text-anchor="middle" fill="#222">in-session, one card</text>
<rect x="30" y="200" width="250" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="155.0" y="224.0" text-anchor="middle" fill="#222" font-weight="bold">/pair-loop</text>
<text x="155.0" y="240.0" text-anchor="middle" fill="#222">pair-cli run --root --parallel --watch: many cards</text>
<rect x="370" y="110" width="260" height="100" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="500.0" y="140.0" text-anchor="middle" fill="#222" font-weight="bold">Autonomy gates</text>
<text x="500.0" y="156.0" text-anchor="middle" fill="#222">until: ready | pr | merged</text>
<text x="500.0" y="172.0" text-anchor="middle" fill="#222">prepare: always | never | when</text>
<text x="500.0" y="188.0" text-anchor="middle" fill="#222">merge: always | never | when</text>
<polyline points="280,88 370,160" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="280,158 370,160" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="280,228 370,160" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="720" y="60" width="250" height="56" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="845.0" y="84.0" text-anchor="middle" fill="#222" font-weight="bold">Stops at ready or PR</text>
<text x="845.0" y="100.0" text-anchor="middle" fill="#222">default until: pr</text>
<rect x="720" y="130" width="250" height="56" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="845.0" y="154.0" text-anchor="middle" fill="#222" font-weight="bold">Merges</text>
<text x="845.0" y="170.0" text-anchor="middle" fill="#222">only when the merge gate opens</text>
<rect x="720" y="200" width="250" height="56" rx="6" fill="#fdecec" stroke="#a33" stroke-width="1.3"/>
<text x="845.0" y="224.0" text-anchor="middle" fill="#222" font-weight="bold">Escalation</text>
<text x="845.0" y="240.0" text-anchor="middle" fill="#222">parks the card, rest continue</text>
<polyline points="630,160 720,88" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="630,160 720,158" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="630,160 720,228" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<text x="30" y="300" text-anchor="start" font-size="11" fill="#333">Same rules in every driver: autonomy precedence is argument, then adoption (## Autonomy), then KB default.</text>
</svg>
