<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">Process lifecycle overview</title>
<desc id="d">Four lifecycle levels: induction, strategic planning, iteration and execution, with the optional brainstorm entry point. Two workflows run on top of them, analysis and refinement, and delivery. Each can run in three modes: Assisted, Semi-automatic and Automatic.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1080" height="380" fill="#ffffff"/>
<text x="30" y="24" font-size="14" font-weight="bold" fill="#222">Process lifecycle overview</text>
<rect x="30" y="50" width="230" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="145.0" y="74.0" text-anchor="middle" fill="#222" font-weight="bold">Induction</text>
<text x="145.0" y="90.0" text-anchor="middle" fill="#222">PRD, bootstrap, initiatives</text>
<rect x="290" y="50" width="230" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="405.0" y="74.0" text-anchor="middle" fill="#222" font-weight="bold">Strategic planning</text>
<text x="405.0" y="90.0" text-anchor="middle" fill="#222">initiatives to epics</text>
<polyline points="260,78.0 290,78.0" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="550" y="50" width="230" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="665.0" y="74.0" text-anchor="middle" fill="#222" font-weight="bold">Iteration</text>
<text x="665.0" y="90.0" text-anchor="middle" fill="#222">stories, refine, tasks</text>
<polyline points="520,78.0 550,78.0" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="810" y="50" width="230" height="56" rx="6" fill="#eef3fb" stroke="#3b5b92" stroke-width="1.3"/>
<text x="925.0" y="74.0" text-anchor="middle" fill="#222" font-weight="bold">Execution</text>
<text x="925.0" y="90.0" text-anchor="middle" fill="#222">implement, review</text>
<polyline points="780,78.0 810,78.0" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="140" width="1000" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
<text x="530.0" y="164.0" text-anchor="middle" fill="#222">Optional entry: /pair-process-brainstorm (discovery)</text>
<rect x="30" y="210" width="490" height="70" rx="6" fill="#fff6df" stroke="#a06a00" stroke-width="1.3"/>
<text x="275.0" y="241.0" text-anchor="middle" fill="#222" font-weight="bold">Analysis and refinement workflow</text>
<text x="275.0" y="257.0" text-anchor="middle" fill="#222">brainstorm, stories, refine, breakdown, Ready</text>
<rect x="550" y="210" width="480" height="70" rx="6" fill="#e9f6ec" stroke="#2f7d46" stroke-width="1.3"/>
<text x="790.0" y="241.0" text-anchor="middle" fill="#222" font-weight="bold">Delivery workflow</text>
<text x="790.0" y="257.0" text-anchor="middle" fill="#222">implement, verify, remediate, merge</text>
<rect x="30" y="310" width="1000" height="40" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.3"/>
<text x="530.0" y="334.0" text-anchor="middle" fill="#222">Three modes: Assisted, Semi-automatic, Automatic</text>
</svg>
