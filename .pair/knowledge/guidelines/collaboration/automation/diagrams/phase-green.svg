<rect x="974" y="54" width="176" height="58" rx="29" fill="#e5f5e8" stroke="#2e8540" stroke-width="1.5"/>
<text x="1062" y="79" text-anchor="middle" fill="#222" font-weight="bold">Handoff</text>
<text x="1062" y="95" text-anchor="middle" fill="#555" font-size="10.5">next: verify</text>
<rect x="266" y="164" width="176" height="58" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="354" y="189" text-anchor="middle" fill="#222" font-weight="bold">May not: edit a sealed test</text>
<text x="354" y="205" text-anchor="middle" fill="#555" font-size="10.5">a gap is reported, not patched</text>
