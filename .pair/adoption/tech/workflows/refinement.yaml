version: 1
name: refinement
description: Refine a card and break it into tasks.
select:
  filter: { status: [Draft] }
  order: [priority, number]
steps:
  refine:
    kind: refine-story
    # A standalone refinement moves to Ready. The shipped workflow waits for tasks.
    state: none
    with: { mode: autonomous }
  tasks:
    kind: plan-tasks
