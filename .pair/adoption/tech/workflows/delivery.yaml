version: 1
name: delivery
description: Implement, review, check, approve and merge one card.
aliases:
  build: { effort: medium }
  judge: { effort: medium }
steps:
  implement:
    kind: implement
    alias: build
    escalate: { failed: stop, blocked: stop, needs-decision: stop }
  review-rounds:
    kind: loop
    until:
      step: review
      condition:
        - when: { output: verdict, equals: approved }
          do: complete
        - prompt: |
            Use the structured findings of this review and previous reviews in this loop.
            Count only findings whose blocking field is true.
            The first review is the baseline. Return false until there are at least
            three follow-up reviews with comparable finding counts.
            Then return true if the count increased since the preceding review,
            or if the last four reviews all have the same blocking count.
            Otherwise return false.
          do: escalate
      max: 9
      on-max: escalate
    steps:
      review:
        kind: review
        alias: judge
        with: { publication: first-and-approved }
        escalate: { failed: continue, blocked: stop, needs-decision: stop }
      fix:
        kind: fix
        escalate: { failed: continue, blocked: stop, needs-decision: stop }
        alias: build
        with: { continue-on-gate-failure: true }
  gate:
    kind: gate
    on-resume: { reason: head-changed, step: review-rounds }
    with:
      gates: [target:pr]
      checks: [head-unchanged]
  approval:
    kind: approval
    escalate: { failed: stop, needs-decision: stop }
    on-resume: { reason: head-moved, step: review-rounds }
    with: { question: 'Approve merging this reviewed head?' }
  merge:
    kind: merge
    on-resume: { reason: head-moved, step: review-rounds }
