version: 1
name: delivery
description: Implement, review, check, approve and merge one card.
aliases:
  build: { effort: medium }
  judge: { effort: medium }
steps:
  implement: { kind: implement, alias: build }
  review-rounds:
    kind: loop
    until: review
    max: 3
    on-max: escalate
    steps:
      review: { kind: review, alias: judge, with: { publication: first-and-approved } }
      fix:
        kind: fix
        alias: build
        with: { continue-on-gate-failure: true }
  gate:
    kind: gate
    with:
      gates: [target:pr]
      checks: [head-unchanged]
  approval:
    kind: approval
    with: { question: 'Approve merging this reviewed head?' }
  merge: { kind: merge }
