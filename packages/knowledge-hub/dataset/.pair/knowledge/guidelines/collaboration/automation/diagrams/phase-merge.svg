<text x="30" y="22" font-size="14" font-weight="bold" fill="#222">merge — a script re-reads every signal, then merges or parks</text>
<polyline points="206,83 266,83" fill="none" stroke="#444" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="222.7" y="66" width="26.6" height="16" fill="#ffffff" opacity="0.92"/><text x="236" y="78" text-anchor="middle" fill="#333" font-size="11">yes</text>
