<text x="118" y="95" text-anchor="middle" fill="#555" font-size="10.5">## Autonomy / Auto-Advance</text>
<rect x="266" y="54" width="176" height="58" rx="6" fill="#f0f0f0" stroke="#555555" stroke-width="1.5"/>
<text x="354" y="79" text-anchor="middle" fill="#222" font-weight="bold">Re-read signals</text>
<text x="354" y="95" text-anchor="middle" fill="#555" font-size="10.5">tier, head, checks</text>
