<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 252" width="944" height="252" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title id="t">merge — a script re-reads every signal, then merges or parks</title>
<desc id="d">The merge stage is a script, not an agent. It runs only when the project opted in, re-reads the tier, head and checks, and either merges and closes the story or parks the card with a comment.</desc>
