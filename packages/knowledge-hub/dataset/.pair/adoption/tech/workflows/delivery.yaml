version: 1
name: delivery
description: Implement, review, check, approve and merge one card.
aliases:
  build: { effort: medium }
  judge: { effort: high }
steps:
  implement: { kind: implement, alias: build }
  review: { kind: review, alias: judge, with: { publication: first-and-approved } }
  gate:
    kind: gate
    on-resume: { reason: head-changed, step: review }
    with:
      gates: [target:pr]
      checks: [head-unchanged]
  approval:
    kind: approval
    on-resume: { reason: head-moved, step: review }
    with: { question: 'Approve merging this reviewed head?' }
  merge:
    kind: merge
    on-resume: { reason: head-moved, step: review }
