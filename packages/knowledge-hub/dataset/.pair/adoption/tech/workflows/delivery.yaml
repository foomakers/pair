version: 1
name: delivery
description: Implement a card, review and fix until clean, check, approve, merge.
select:
  filter: { status: [Ready] }
  order: [priority, number]
aliases:
  build: {}
  judge: {}
steps:
  implement:
    kind: implement
    alias: build
    gates: [target:pr]
    escalate: { failed: stop, blocked: stop, needs-decision: stop }
  rounds:
    kind: loop
    until: review
    max: 3
    on-max: escalate
    steps:
      review:
        kind: review
        alias: judge
        escalate: { failed: continue, blocked: stop, needs-decision: stop }
      fix:
        kind: fix
        alias: build
        gates: [target:pr]
        escalate: { failed: stop, blocked: stop, needs-decision: stop }
  checks:
    kind: gate
    with: { gates: [target:pr], checks: [ci-green, head-unchanged] }
  approve:
    kind: approval
    escalate: { failed: stop, needs-decision: stop }
    with: { question: Merge this PR? }
  merge:
    kind: merge
