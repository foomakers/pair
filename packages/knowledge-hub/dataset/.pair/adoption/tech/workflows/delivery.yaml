version: 1
name: delivery
description: Implement, review, check, approve and merge one card.
aliases:
  build: { effort: medium }
  judge: { effort: high }
steps:
  implement: { kind: implement, alias: build }
  review: { kind: review, alias: judge }
  gate:
    kind: gate
    with:
      checks: [head-unchanged, ci-green, review-approved, prerequisites-done]
  approval:
    kind: approval
    with: { question: 'Approve merging this reviewed head?' }
  merge: { kind: merge }
